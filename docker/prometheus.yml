global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: notification-api
    static_configs:
      - targets: ["api:8000"]

  # Scraped separately: the worker is a different process with its own
  # registry, and it is the process that actually knows about deliveries.
  - job_name: notification-worker
    static_configs:
      - targets: ["worker:9101"]
